[package]
name = "smee"
version = "0.1.0"
description = "Smee is a Git hooks manager."
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/lpireyn/smee/"

[[bin]]
name = "smee"
path = "src/main.rs"

[dependencies]
eyre = "0.6"
is_executable = "1.0"
log = "0.4"
owo-colors = { version = "4.2", features = ["supports-colors"] }
tempfile = "3.23"

[dependencies.clap]
version = "4.5"
default-features = false
features = ["cargo", "color", "derive", "error-context", "help", "std", "usage"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
