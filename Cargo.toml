[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lpireyn/smee/"

[workspace.dependencies]
eyre = "0.6"
log = { version = "0.4", features = ["std"] }
logger = { path = "crates/logger" }
owo-colors = "4.2"
smee = { path = "crates/smee" }

[workspace.dependencies.clap]
version = "4.5"
default-features = false
features = ["cargo", "color", "derive", "error-context", "help", "std", "usage"]

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
